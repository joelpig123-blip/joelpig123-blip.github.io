<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Audio Clue</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #f3f4f6;
      font-family: Arial, Helvetica, sans-serif;
      color: #111827;
    }

    .card {
      width: 100%;
      max-width: 440px;
      padding: 32px 24px;
      text-align: center;
      background: white;
      border-radius: 18px;
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.12);
    }

    h1 {
      margin: 0 0 10px;
      font-size: 2rem;
    }

    p {
      margin: 0 0 24px;
      color: #4b5563;
      line-height: 1.5;
    }

    audio {
      width: 100%;
    }

    .note {
      margin-top: 20px;
      font-size: 0.85rem;
      color: #6b7280;
    }
  </style>
</head>

<body>
  <main class="card">
    <h1>You're a wizard Harry</h1>

    <audio controls preload="metadata">
      <source src="song.mp3" type="audio/mpeg" />
      Your browser does not support the audio player.
    </audio>

  </main>
</body>
</html>
