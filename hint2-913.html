<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>hint2</title>
<style>
body{
    margin:0;
    background:#eef2f7;
    font-family:Arial,sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}
.card{
    width:min(92vw,550px);
    background:red;
    border-radius:18px;
    box-shadow:0 10px 30px rgba(0,0,0,.15);
    padding:28px;
}
h1{
    margin:0 0 8px;
    text-align:center;
}
p{
    text-align:center;
    color:#666;
    margin:0 0 24px;
}
.row{
    margin-bottom:18px;
}
label{
    display:block;
    font-weight:bold;
    margin-bottom:6px;
}
audio{
    width:100%;
}
</style>
</head>
<body>
<div class="card">

<div class="row">
<audio controls preload="metadata">
<source src="1.mp3" type="audio/mpeg">
</audio>
</div>

<div class="row">
<audio controls preload="metadata">
<source src="2.mp3" type="audio/mpeg">
</audio>
</div>

<div class="row">
<audio controls preload="metadata">
<source src="3.mp3" type="audio/mpeg">
</audio>
</div>

<div class="row">
<audio controls preload="metadata">
<source src="4.mp3" type="audio/mpeg">
</audio>
</div>

</div>
</body>
</html>
