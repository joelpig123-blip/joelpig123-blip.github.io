<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dobby is FREEE</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #eef2f7;
      font-family: Arial, Helvetica, sans-serif;
      color: #111827;
    }

    .card {
      width: 100%;
      max-width: 560px;
      padding: 28px;
      text-align: center;
      background: white;
      border-radius: 18px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.14);
    }

    h1 {
      margin: 0 0 10px;
      font-size: 2rem;
    }

    p {
      margin: 0 0 22px;
      color: #6b7280;
    }

    img {
      display: block;
      width: 100%;
      max-height: 65vh;
      object-fit: contain;
      margin-bottom: 22px;
      border-radius: 12px;
      background: #f9fafb;
    }

    .download-button {
      display: inline-block;
      padding: 14px 24px;
      border-radius: 10px;
      background: #111827;
      color: white;
      text-decoration: none;
      font-size: 1rem;
      font-weight: bold;
    }

    .download-button:active {
      transform: scale(0.98);
    }

    .note {
      margin-top: 16px;
      font-size: 0.82rem;
      color: #9ca3af;
    }
  </style>
</head>

<body>
  <main class="card">
    <h1>Dobby is FREEE</h1>
    <p>Highly recommend holding image and downloading to photos</p>

    <img src="black.jpg" alt="black" />

  </main>
</body>
</html>
